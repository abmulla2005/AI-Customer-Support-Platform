version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: aisupport_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: ai_support_platform
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aisupport_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DATABASE=ai_support_platform
      - JWT_SECRET=changethis_super_secret_jwt_access_key_minimum_32_characters_long_12345
      - JWT_REFRESH_SECRET=changethis_super_secret_jwt_refresh_key_minimum_32_characters_long_12345
      - FRONTEND_URL=http://localhost:5173
      - BACKEND_URL=http://localhost:8000
    depends_on:
      - mongodb
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aisupport_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo_data:
